<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="200" viewBox="0 0 720 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle doré -->
  <circle cx="90" cy="100" r="60" fill="none" stroke="#C5A572" stroke-width="3"/>

  <!-- Point doré intérieur -->
  <circle cx="110" cy="100" r="10" fill="#C5A572"/>

  <!-- Lettre P (blanc pour fond sombre) -->
  <path d="M 70 60 L 70 140 M 70 60 L 100 60 Q 115 60 115 75 Q 115 90 100 90 L 70 90"
        stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Texte PLANORA (blanc) -->
  <text x="180" y="110" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="-1">PLANORA</text>

  <!-- Texte 360 (doré) -->
  <text x="580" y="110" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#C5A572" letter-spacing="-1">360</text>

  <!-- Sous-titre (blanc) -->
  <text x="180" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" letter-spacing="0.5">Planifier - Suivre - Performer</text>
</svg>
